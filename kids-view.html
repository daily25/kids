<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <meta name="theme-color" content="#0d0d0d">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="description" content="View kids' daily tasks and pocket money">

    <title>Kids Tasks - View</title>

    <link rel="manifest" href="./manifest-kids.json">
    <link rel="icon" type="image/png" href="assets/oliver.png">
    <link rel="apple-touch-icon" href="assets/oliver.png">
    <link rel="stylesheet" href="css/styles.css">
    <style>
        /* Read-only badge */
        .readonly-badge {
            background: linear-gradient(135deg, #6366f1, #8b5cf6);
            color: white;
            font-size: 0.65rem;
            padding: 3px 8px;
            border-radius: 12px;
            margin-left: 8px;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        /* Disable task interactions */
        .task-card {
            pointer-events: none;
        }

        /* Keep nav clickable */
        .nav-item {
            pointer-events: auto;
        }

        /* Hide sync notification since we're read-only */
        .sync-notification {
            display: none !important;
        }
    </style>
</head>

<body>
    <div id="app">
        <!-- Header (simplified - no buttons) -->
        <header class="app-header">
            <button class="header-btn" id="reloadBtn" aria-label="Reload" title="Reload app">
                <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                    <path d="M21 12a9 9 0 11-3-6.72M21 3v6h-6"></path>
                </svg>
            </button>
            <h1 class="app-title" id="homeBtn" style="cursor:pointer"><span class="title-accent">Kids</span>Tasks</h1>
            <span class="app-version">v0.48</span>
            <span class="readonly-badge">View Only</span>
            <div class="header-right">
                <!-- Cloud sync indicator -->
                <span id="syncIndicator" class="sync-indicator" title="Cloud sync status">☁️</span>
            </div>
        </header>

        <!-- Points & Money Summary (hidden on dashboard) -->
        <div class="summary-bar" id="summaryBar" style="display:none;">
            <div class="summary-item">
                <span class="summary-label">Points</span>
                <span class="summary-value" id="totalPoints">0/0</span>
            </div>
            <div class="summary-item">
                <span class="summary-label">This Week</span>
                <span class="summary-value money" id="weeklyMoney">$0.00</span>
            </div>
        </div>

        <!-- Day Headers (hidden on dashboard) -->
        <div class="day-headers" id="dayHeaders" style="display:none;">
            <!-- Generated by JS -->
        </div>

        <!-- Task List -->
        <main class="task-list" id="taskList">
            <!-- Tasks will be rendered here -->
        </main>

        <!-- Bottom Navigation -->
        <nav class="bottom-nav" id="bottomNav">
            <button class="nav-item" data-kid="oliver">
                <img src="assets/oliver.png" alt="Oliver" class="nav-avatar">
                <span class="nav-name">Oliver</span>
                <span class="nav-money" id="oliverMoney">$50</span>
            </button>
            <button class="nav-item" data-kid="miles">
                <img src="assets/miles.png" alt="Miles" class="nav-avatar">
                <span class="nav-name">Miles</span>
                <span class="nav-money" id="milesMoney">$30</span>
            </button>
            <button class="nav-item" data-kid="zander">
                <img src="assets/zander.png" alt="Zander" class="nav-avatar">
                <span class="nav-name">Zander</span>
                <span class="nav-money" id="zanderMoney">$20</span>
            </button>
        </nav>
    </div>

    <!-- Firebase SDK -->
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-database-compat.js"></script>

    <script src="js/firebase.js?v=2"></script>
    <script src="js/storage.js?v=8"></script>
    <script src="js/components.js?v=8"></script>
    <script src="js/app-readonly.js?v=10"></script>
</body>

</html>
